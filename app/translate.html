<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Translate Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1c1c1e;
      --surface: #2c2c2e;
      --border: #3a3a3c;
      --text: #f2f2f7;
      --text-dim: #8e8e93;
      --accent: #0a84ff;
      --result-bg: #242426;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f2f2f7;
        --surface: #ffffff;
        --border: #d1d1d6;
        --text: #1c1c1e;
        --text-dim: #8e8e93;
        --accent: #007aff;
        --result-bg: #f8f8fa;
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 14px;
    }

    body {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      height: 100%;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--accent); }

    .arrow {
      color: var(--text-dim);
      font-size: 12px;
      user-select: none;
    }

    .spacer { flex: 1; }

    .clear-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
    }
    .clear-btn:hover { background: var(--border); }

    #source {
      flex: 1;
      min-height: 0;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      line-height: 1.5;
    }
    #source:focus { border-color: var(--accent); }
    #source::placeholder { color: var(--text-dim); }

    .divider {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-status {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    #result {
      flex: 1;
      min-height: 0;
      background: var(--result-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.6;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      user-select: text;
    }
    #result.placeholder { color: var(--text-dim); font-style: italic; }
    #result.error { color: #ff453a; }
  </style>
</head>
<body>

  <div class="toolbar">
    <select id="sl">
      <option value="auto">Auto detect</option>
      <option value="en">English</option>
      <option value="zh-CN">Chinese</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="es">Spanish</option>
    </select>
    <span class="arrow">→</span>
    <select id="tl">
      <option value="zh-CN">Chinese (Simplified)</option>
      <option value="en">English</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="fr">French</option>
      <option value="de">German</option>
      <option value="es">Spanish</option>
    </select>
    <div class="spacer"></div>
    <button class="clear-btn" id="clear-btn" title="Clear">✕</button>
  </div>

  <textarea id="source" placeholder="Enter text to translate…" spellcheck="false"></textarea>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-status" id="status"></div>
    <div class="divider-line"></div>
  </div>

  <div id="result" class="placeholder">Translation appears here</div>

  <script>
    const source = document.getElementById('source');
    const result = document.getElementById('result');
    const status = document.getElementById('status');

    let debounce = null;

    function showResult(text, cls) {
      result.textContent = text;
      result.className = cls || '';
    }

    async function doTranslate(text) {
      const sl = document.getElementById('sl').value;
      const tl = document.getElementById('tl').value;
      status.textContent = 'Translating…';
      try {
        const translated = await pywebview.api.translate(text, sl, tl);
        showResult(translated);
        status.textContent = '';
      } catch (e) {
        showResult('Translation failed — check network connection.', 'error');
        status.textContent = '';
      }
    }

    source.addEventListener('input', () => {
      clearTimeout(debounce);
      const text = source.value.trim();
      if (!text) {
        showResult('Translation appears here', 'placeholder');
        status.textContent = '';
        return;
      }
      debounce = setTimeout(() => doTranslate(text), 400);
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      source.value = '';
      showResult('Translation appears here', 'placeholder');
      status.textContent = '';
      source.focus();
    });

    // Called by Python daemon when text arrives from PopClip
    window.__injectText = function(text) {
      source.value = text;
      source.dispatchEvent(new Event('input'));
      source.focus();
    };
  </script>
</body>
</html>
